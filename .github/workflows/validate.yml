name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: CLI tests
        run: npm test
      - name: loadout doctor
        run: node dist/index.js doctor
